[package]
name = "chaoxing-setup"
version = "0.1.0"
edition = "2021"
description = "超星 AI 答题 的安装器与卸载器"

[lib]
name = "setup_core"
path = "src/lib.rs"

[[bin]]
name = "chaoxing-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "chaoxing-uninstall"
path = "src/bin/uninstall.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true